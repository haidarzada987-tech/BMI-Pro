name: bmi_pro
description: BMI Pro - local-first BMI and wellness tracker.
publish_to: none
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/male/young/
    - assets/characters/male/adult/
    - assets/characters/male/senior/
    - assets/characters/female/young/
    - assets/characters/female/adult/
    - assets/characters/female/senior/
